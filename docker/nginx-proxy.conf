# docker/nginx-proxy.conf
# ---------------------------------------------------------------------------
# Un proxy mínimo, y solo para una cosa: ver que TRUST_PROXY hace lo que dice.
#
# Sin algo delante, `req.ip` es siempre la IP real del cliente y el ajuste no
# se puede probar: es la clase de comportamiento que no se ve en un test de
# integración porque depende de quién escribe la cabecera.
#
# Arranca solo con `docker compose --profile proxy up`, así que el despliegue
# normal no lo levanta.
# ---------------------------------------------------------------------------

server {
    listen 8080;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        # Lo que hace de esto un proxy de verdad para el caso que se prueba:
        # `$proxy_add_x_forwarded_for` conserva lo que ya venía en la cabecera
        # y le añade la IP de quien nos habla. Con `TRUST_PROXY=1`, Express se
        # queda con el ÚLTIMO salto que no es de confianza; con 0 no mira la
        # cabecera y todo el tráfico parece venir del propio nginx.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }
}
