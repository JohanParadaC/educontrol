# Integración continua de EduControl.
#
# Cuatro trabajos en paralelo, porque fallan por motivos distintos y conviene
# saber cuál se ha roto sin leer un log de diez minutos:
#   · calidad  → ESLint y Prettier
#   · backend  → 272 tests con cobertura (los umbrales viven en jest.config.js)
#   · frontend → 108 tests con cobertura (los umbrales viven en karma.conf.js)
#   · e2e      → 13 recorridos con Playwright sobre la aplicación de verdad
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Un push nuevo sobre la misma rama cancela la ejecución anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  calidad:
    name: Lint y formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependencias
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: ESLint (backend y frontend)
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  backend:
    name: Tests del backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # mongodb-memory-server descarga un binario de mongod la primera vez.
      # Sin esta caché, cada ejecución vuelve a bajarlo.
      - name: Caché del mongod en memoria
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Instalar dependencias
        run: npm ci --prefix backend

      # test:cov añade --coverage, así que los coverageThreshold de
      # jest.config.js (82/68/95/84) hacen fallar el trabajo si la cobertura baja.
      - name: Jest con cobertura
        run: npm run test:cov --prefix backend

  frontend:
    name: Tests del frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --prefix frontend

      # El runner de GitHub trae Chrome y no corre como root, así que
      # ChromeHeadless arranca con su sandbox puesto: no hace falta
      # --no-sandbox.
      #
      # test:cov añade --code-coverage, así que el bloque `check` de
      # karma.conf.js (70/45/65/72) hace fallar el trabajo si la cobertura baja.
      - name: Karma en Chrome sin interfaz, con cobertura
        run: npm run test:cov --prefix frontend

      - name: Build de producción
        run: npm run build --prefix frontend

      # La CSP del backend prohíbe los scripts en línea, y eso incluye los
      # `onload=` de un atributo. Angular ponía uno al diferir la hoja de
      # estilos (inlineCritical), y el resultado era una aplicación sin
      # estilos: el navegador bloqueaba el handler y la hoja se quedaba en
      # media="print" para siempre. Está desactivado en angular.json; esto
      # avisa si vuelve.
      - name: El build no trae manejadores en línea (los bloquea la CSP)
        run: |
          if grep -q 'onload=' frontend/dist/educontrol-frontend/browser/index.html; then
            echo "El index.html tiene un manejador en línea: la CSP lo bloqueará."
            exit 1
          fi

  e2e:
    name: Extremo a extremo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      # El servidor levanta un Mongo en memoria: se cachea su binario igual que
      # en el trabajo del backend, o cada ejecución vuelve a bajarlo.
      - name: Caché del mongod en memoria
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Caché del navegador de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Los tres: `npm run serve` construye el frontend y arranca el backend.
      - name: Instalar dependencias
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      # `--with-deps` instala también las librerías del sistema que pide
      # Chromium en el runner. Con la caché puesta, el navegador ya está y
      # esto solo comprueba.
      - name: Navegador de Playwright
        run: npx playwright install --with-deps chromium

      # playwright.config.ts levanta el servidor por su cuenta y espera al
      # health-check, no al puerto: el puerto responde antes de que Mongo esté
      # conectado y sembrado.
      - name: Playwright
        run: npm run test:e2e
        env:
          CI: 'true'

      # Solo cuando algo falla: el informe lleva la traza y la captura del
      # momento exacto, que es justo lo que no se puede reproducir después.
      - name: Informe de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
