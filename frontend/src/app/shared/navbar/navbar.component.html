<mat-toolbar>
  <!-- Marca: lleva a la pantalla de inicio que corresponda al rol -->
  <a class="brand" [routerLink]="rutaInicio">EduControl</a>

  <span class="flex"></span>

  <!-- Enlaces en línea (solo escritorio) -->
  <nav class="enlaces-escritorio" aria-label="Navegación principal">
    <a mat-button *ngFor="let e of enlacesVisibles"
       [routerLink]="e.ruta"
       routerLinkActive="active">
      {{ e.etiqueta }}
    </a>
    <button mat-button *ngIf="isLoggedIn" (click)="logout()">Salir</button>
  </nav>

  <!-- Botón de menú (solo móvil) -->
  <button mat-icon-button class="boton-menu"
          (click)="alternarMenu()"
          [attr.aria-expanded]="menuAbierto"
          aria-controls="menu-movil"
          [attr.aria-label]="menuAbierto ? 'Cerrar menú' : 'Abrir menú'">
    <mat-icon>{{ menuAbierto ? 'close' : 'menu' }}</mat-icon>
  </button>
</mat-toolbar>

<!-- Panel desplegable en móvil.
     Los enlaces salen de la misma lista que en escritorio, así que no pueden
     desincronizarse. -->
<div class="menu-movil" id="menu-movil" *ngIf="menuAbierto">
  <nav aria-label="Navegación principal">
    <!-- (click) además de la suscripción a NavigationEnd: si tocas el enlace de
         la página en la que ya estás no hay navegación, y el menú se quedaba
         abierto tapando el contenido. -->
    <a mat-button *ngFor="let e of enlacesVisibles"
       [routerLink]="e.ruta"
       routerLinkActive="active"
       (click)="cerrarMenu()">
      <mat-icon>{{ e.icono }}</mat-icon>
      <span>{{ e.etiqueta }}</span>
    </a>
    <button mat-button *ngIf="isLoggedIn" (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Salir</span>
    </button>
  </nav>
</div>

<!-- Capa que atenúa el fondo y cierra el menú al tocar fuera. Es un <button>
     y no un <div> para que también se pueda cerrar con el teclado. -->
<button
  type="button"
  class="fondo-menu"
  *ngIf="menuAbierto"
  aria-label="Cerrar menú"
  (click)="cerrarMenu()"
></button>
