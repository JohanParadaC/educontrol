<mat-card class="auth-card">
  <h1>Crear cuenta</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
    <mat-form-field appearance="outline" class="full">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" autocomplete="name">
      <mat-error *ngIf="form.get('nombre')?.hasError('required')">Escribe tu nombre</mat-error>
      <mat-error *ngIf="form.get('nombre')?.hasError('minlength')">Mínimo 2 caracteres</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Correo</mat-label>
      <input matInput formControlName="correo" type="email" autocomplete="email">
      <mat-error *ngIf="form.get('correo')?.hasError('required')">Escribe tu correo</mat-error>
      <mat-error *ngIf="form.get('correo')?.hasError('email')">Ese correo no tiene un formato válido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Contraseña</mat-label>
      <input matInput [type]="hide ? 'password' : 'text'" formControlName="password" autocomplete="new-password">
      <!-- Antes este botón no tenía nombre accesible: para un lector de pantalla
           era un icono mudo. -->
      <button mat-icon-button matSuffix type="button" (click)="hide = !hide"
              [attr.aria-label]="hide ? 'Mostrar contraseña' : 'Ocultar contraseña'"
              [attr.aria-pressed]="!hide">
        <mat-icon>{{ hide ? 'visibility' : 'visibility_off' }}</mat-icon>
      </button>
      <mat-hint>Mínimo 6 caracteres</mat-hint>
      <mat-error *ngIf="form.get('password')?.hasError('required')">Escribe una contraseña</mat-error>
      <mat-error *ngIf="form.get('password')?.hasError('minlength')">Mínimo 6 caracteres</mat-error>
    </mat-form-field>

    <button mat-flat-button color="primary" type="submit" class="cta">
      {{ enviando ? 'Creando cuenta…' : 'Crear cuenta' }}
    </button>

    <div class="error" *ngIf="msg" role="alert">{{ msg }}</div>

    <p class="links">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </form>
</mat-card>
