<mat-card class="auth-card">
  <h1>Iniciar sesión</h1>

  <!-- novalidate: la validación la muestra Angular, no el navegador -->
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
    <mat-form-field appearance="outline" class="full">
      <mat-label>Correo</mat-label>
      <input matInput formControlName="correo" type="email" autocomplete="email" />
      <mat-error *ngIf="form.get('correo')?.hasError('required')">Escribe tu correo</mat-error>
      <mat-error *ngIf="form.get('correo')?.hasError('email')"
        >Ese correo no tiene un formato válido</mat-error
      >
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Contraseña</mat-label>
      <input
        matInput
        [type]="hide ? 'password' : 'text'"
        formControlName="password"
        autocomplete="current-password"
      />
      <!-- aria-label dinámico: antes decía siempre "Mostrar/Ocultar", sin reflejar el estado -->
      <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="hide = !hide"
        [attr.aria-label]="hide ? 'Mostrar contraseña' : 'Ocultar contraseña'"
        [attr.aria-pressed]="!hide"
      >
        <mat-icon>{{ hide ? 'visibility' : 'visibility_off' }}</mat-icon>
      </button>
      <mat-error *ngIf="form.get('password')?.hasError('required')"
        >Escribe tu contraseña</mat-error
      >
    </mat-form-field>

    <!-- Sin [disabled]: siempre pulsable, valida al enviar -->
    <button mat-flat-button color="primary" type="submit" class="cta" [class.cargando]="enviando">
      {{ enviando ? 'Entrando…' : 'Entrar' }}
    </button>

    <!-- role="alert" para que el lector de pantalla anuncie el fallo -->
    <div class="error" *ngIf="msg" role="alert">{{ msg }}</div>

    <p class="links">¿No tienes cuenta? <a routerLink="/register">Crear cuenta</a></p>
  </form>
</mat-card>

<!-- Acceso de demostración: este es un proyecto de portfolio y quien lo abre no
     va a registrarse. Un clic rellena el formulario con cada rol. -->
<mat-card class="demo-card">
  <h2>Probar sin registrarse</h2>
  <p class="demo-hint">Elige un rol y entra directamente:</p>

  <div class="demo-roles">
    <button type="button" mat-stroked-button *ngFor="let d of demos" (click)="usarDemo(d)">
      {{ d.etiqueta }}
    </button>
  </div>
</mat-card>
