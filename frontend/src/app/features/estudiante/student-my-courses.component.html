<h2 class="titulo">Mis cursos</h2>

@if (cargando || error || !inscripciones.length) {
  <app-estado-vista
    [cargando]="cargando"
    [error]="error"
    mensajeVacio="Aún no tienes cursos."
    iconoVacio="school"
    (reintentar)="cargar()"
  >
  </app-estado-vista>
}

@if (!cargando && !error && inscripciones.length) {
  <div class="grid gap-3">
    @for (i of inscripciones; track trackIns($index, i)) {
      <mat-card class="course">
        <div class="head">
          <div>
            <h3>{{ tituloDe(i.curso) }}</h3>
            <div class="muted">{{ profesorDe(i.curso) || '—' }}</div>
          </div>
          <button
            mat-stroked-button
            color="warn"
            [disabled]="cancelandoId === i._id"
            (click)="desmatricular(i)"
          >
            <mat-icon>cancel</mat-icon>
            {{ cancelandoId === i._id ? 'Cancelando…' : 'Cancelar matrícula' }}
          </button>
        </div>
      </mat-card>
    }
  </div>
}

@if (!cargando && !error) {
  <p class="pie">
    <a routerLink="/cursos">Explorar el catálogo</a>
  </p>
}
